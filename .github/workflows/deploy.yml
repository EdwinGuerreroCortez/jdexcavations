
name: Deploy JD Excavations to Hostinger

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jdexcavations-production
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build React and Vite
        run: npm run build

      - name: Verify build
        run: |
          test -f dist/index.html
          echo "Build completed successfully"

      - name: Deploy to Hostinger
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USER }}
          port: ${{ secrets.HOSTINGER_PORT }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          fingerprint: ${{ secrets.HOSTINGER_FINGERPRINT }}
          source: "dist/*"
          target: ${{ secrets.HOSTINGER_TARGET }}
          strip_components: 1
          overwrite: true

      - name: Deployment completed
        run: echo "JD Excavations deployed successfully!"
